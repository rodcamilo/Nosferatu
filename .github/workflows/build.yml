name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias do Sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Limpar Cache e Compilar APK com Buildozer
        run: |
          # Limpa o cache para aplicar o novo nome, pacote e icone
          buildozer distclean
          # Aceita automaticamente licenças do Android SDK durante a compilação
          yes | buildozer android debug

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NosferatuApp-APK
          path: bin/*.apk
