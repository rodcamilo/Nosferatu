name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE20: "true"

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar Dependencias do Sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Compilar APK com Buildozer
        run: |
          # Aceita automaticamente licenças do Android SDK durante a compilação
          yes | buildozer android debug

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NosferatuAPK
          path: bin/*.apk
