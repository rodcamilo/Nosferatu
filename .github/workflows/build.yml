name: Compilar APK e Windows EXE

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-22.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE20: "true"

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias do Sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" cython

      - name: Compilar APK com Buildozer
        run: |
          yes | buildozer android debug

      - name: Salvar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NosferatuAPK
          path: bin/*.apk

  build-windows:
    name: Compilar Executavel Windows
    runs-on: windows-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller kivy[base]
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Gerar Executavel com PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed main.py

      - name: Salvar Executavel como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NosferatuWindows
          path: dist/main
